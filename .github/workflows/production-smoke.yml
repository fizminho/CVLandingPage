name: Production security smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-security-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Check live production security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run production smoke tests
        run: node scripts/production-smoke-test.mjs
        env:
          SMOKE_BASE_URL: https://binalah.com
