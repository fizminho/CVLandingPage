<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">CV</title>
  <meta name="description" content="Professional profile, experience, skills and projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="cv-download.js"></script>
  <script defer src="app.js"></script>
  <script defer src="chatbot.js"></script>
</head>
<body>
  <nav>
    <span class="nav-brand" id="nav-brand"></span>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="nav-download" id="nav-download" type="button">⬇ Download CV</button>
  </nav>
  <header class="hero">
    <div class="hero-avatar">👨‍💻</div>
    <h1 id="hero-name"></h1>
    <p class="tagline" id="hero-tagline"></p>
    <p class="location" id="hero-location"></p>
    <div class="contact-links" id="hero-contacts"></div>
  </header>
  <main id="main"></main>
  <footer><span id="footer-name"></span> — Built on Cloudflare</footer>
  <div class="chat-launcher">
    <div class="chat-widget" id="chat-widget">
      <div class="chat-header">
        <div class="chat-header-title"><span class="chat-status"></span><span>Ask about Hafiz</span></div>
        <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">✕</button>
      </div>
      <div class="chat-messages" id="chat-messages" aria-live="polite">
        <div class="chat-msg chat-msg--model">Hi! Ask me anything about Hafiz's experience, skills, or projects. 👋</div>
      </div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" maxlength="2000" placeholder="Ask a question…" autocomplete="off" />
        <button id="chat-send" type="button">Send</button>
      </div>
    </div>
    <div class="chat-controls"><button class="chat-label" id="chat-label" type="button">💬 Ask me anything!</button></div>
  </div>
</body>
</html>
